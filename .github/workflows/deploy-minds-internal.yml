name: Deploy Minds internal Durabull

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-minds-internal.yml
      - apps/api/**
      - apps/web/**
      - packages/**
      - tooling/docker/**
      - package.json
      - bun.lock
      - deploy/digitalocean-app.template.json
      - deploy/render-digitalocean-spec.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-minds-internal-durabull
  cancel-in-progress: false

env:
  PRODUCTION_VALKEY_CLUSTER_ID: 1a8db10a-cad7-4eb3-8073-c046e98e5a7f
  DURABULL_IMAGE: registry.digitalocean.com/training/durabull

jobs:
  deploy:
    name: Deploy standalone internal app
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DURABULL_MCP_AUTHLESS_BEARER: ${{ secrets.DURABULL_MCP_AUTHLESS_BEARER }}
          DURABULL_REDIS_URL_ENCRYPTION_KEY: ${{ secrets.DURABULL_REDIS_URL_ENCRYPTION_KEY }}
          DURABULL_SECRET_ENCRYPTION_KEY: ${{ secrets.DURABULL_SECRET_ENCRYPTION_KEY }}
          DURABULL_PRODUCTION_REDIS_URL: ${{ secrets.DURABULL_PRODUCTION_REDIS_URL }}
          DURABULL_STAGING_REDIS_URL: ${{ secrets.DURABULL_STAGING_REDIS_URL }}
        run: |
          set -euo pipefail
          required=(
            DIGITALOCEAN_ACCESS_TOKEN
            CLOUDFLARE_TUNNEL_TOKEN
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
            DURABULL_MCP_AUTHLESS_BEARER
            DURABULL_REDIS_URL_ENCRYPTION_KEY
            DURABULL_SECRET_ENCRYPTION_KEY
            DURABULL_PRODUCTION_REDIS_URL
            DURABULL_STAGING_REDIS_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and publish immutable application image
        env:
          DURABULL_IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          doctl registry login --expiry-seconds 1200
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          app_version=$(jq -er '.version' package.json)
          docker build \
            -f tooling/docker/Dockerfile \
            --build-arg "DURABULL_APP_VERSION=$app_version" \
            --build-arg "DURABULL_BUILD_ID=$GITHUB_SHA" \
            --build-arg "DURABULL_BUILD_TIME=$build_time" \
            --build-arg "DURABULL_RELEASE_CHANNEL=minds-internal" \
            -t "$DURABULL_IMAGE:$DURABULL_IMAGE_TAG" \
            .
          docker push "$DURABULL_IMAGE:$DURABULL_IMAGE_TAG"

      - name: Render app spec
        env:
          DURABULL_IMAGE_TAG: ${{ github.sha }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DURABULL_MCP_AUTHLESS_BEARER: ${{ secrets.DURABULL_MCP_AUTHLESS_BEARER }}
          DURABULL_REDIS_URL_ENCRYPTION_KEY: ${{ secrets.DURABULL_REDIS_URL_ENCRYPTION_KEY }}
          DURABULL_SECRET_ENCRYPTION_KEY: ${{ secrets.DURABULL_SECRET_ENCRYPTION_KEY }}
          DURABULL_PRODUCTION_REDIS_URL: ${{ secrets.DURABULL_PRODUCTION_REDIS_URL }}
          DURABULL_STAGING_REDIS_URL: ${{ secrets.DURABULL_STAGING_REDIS_URL }}
        run: |
          chmod +x deploy/render-digitalocean-spec.sh
          deploy/render-digitalocean-spec.sh \
            deploy/digitalocean-app.template.json \
            deploy/digitalocean-app.rendered.json

      - name: Validate app spec
        run: doctl apps spec validate deploy/digitalocean-app.rendered.json

      - name: Create or update standalone app
        run: |
          set -euo pipefail
          doctl apps create \
            --upsert \
            --update-sources \
            --wait \
            --spec deploy/digitalocean-app.rendered.json \
            --format ID,Spec.Name,ActiveDeployment.ID

      - name: Reconcile production Valkey trusted source
        run: |
          set -euo pipefail

          app_id=$(doctl apps list --output json \
            | jq -er '.[] | select(.spec.name == "minds-durabull-internal") | .id')
          is_trusted=$(doctl databases firewalls list \
            "$PRODUCTION_VALKEY_CLUSTER_ID" \
            --output json \
            | jq -r --arg app_id "$app_id" \
              'any(.[]; .type == "app" and .value == $app_id)')

          if [ "$is_trusted" != "true" ]; then
            doctl databases firewalls append \
              "$PRODUCTION_VALKEY_CLUSTER_ID" \
              --rule "app:$app_id"
          fi

          doctl databases firewalls list \
            "$PRODUCTION_VALKEY_CLUSTER_ID" \
            --output json \
            | jq -e --arg app_id "$app_id" \
              'any(.[]; .type == "app" and .value == $app_id)' >/dev/null

      - name: Verify protected live deployment
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DURABULL_MCP_AUTHLESS_BEARER: ${{ secrets.DURABULL_MCP_AUTHLESS_BEARER }}
        run: |
          set -euo pipefail

          base_url=https://durabull.getminds.ai
          access_headers=(
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          )
          for protected_path in / /api/health; do
            for boundary in public mcp-service-credential; do
              boundary_headers=()
              if [ "$boundary" = "mcp-service-credential" ]; then
                boundary_headers=("${access_headers[@]}")
              fi
              boundary_code=$(curl -sS \
                --max-time 20 \
                -o /dev/null \
                -w '%{http_code}' \
                "${boundary_headers[@]}" \
                "$base_url$protected_path")
              if [ "$boundary_code" != "302" ] && [ "$boundary_code" != "403" ]; then
                echo "::error::$boundary access to $protected_path returned HTTP $boundary_code; expected Cloudflare Access rejection"
                exit 1
              fi
            done
          done

          initialize_payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"minds-deploy-e2e","version":"1.0.0"}}}'
          mcp_without_cloudflare=$(curl -sS \
            --max-time 20 \
            -o /dev/null \
            -w '%{http_code}' \
            -H "Origin: $base_url" \
            -H "Authorization: Bearer ${DURABULL_MCP_AUTHLESS_BEARER}" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data "$initialize_payload" \
            "$base_url/mcp")
          if [ "$mcp_without_cloudflare" != "302" ] && [ "$mcp_without_cloudflare" != "403" ]; then
            echo "::error::MCP without Cloudflare credentials returned HTTP $mcp_without_cloudflare; expected Access rejection"
            exit 1
          fi

          mcp_without_bearer=$(curl -sS \
            --max-time 20 \
            -o /dev/null \
            -w '%{http_code}' \
            "${access_headers[@]}" \
            -H "Origin: $base_url" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data "$initialize_payload" \
            "$base_url/mcp")
          if [ "$mcp_without_bearer" != "401" ]; then
            echo "::error::MCP without its bearer returned HTTP $mcp_without_bearer; expected 401"
            exit 1
          fi

          mcp_body="$RUNNER_TEMP/durabull-mcp-initialize.txt"
          mcp_headers="$RUNNER_TEMP/durabull-mcp-initialize.headers"
          mcp_code=$(curl -sS \
            --max-time 20 \
            -D "$mcp_headers" \
            -o "$mcp_body" \
            -w '%{http_code}' \
            "${access_headers[@]}" \
            -H "Origin: $base_url" \
            -H "Authorization: Bearer ${DURABULL_MCP_AUTHLESS_BEARER}" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data "$initialize_payload" \
            "$base_url/mcp")
          if [ "$mcp_code" != "200" ] || ! grep -F '"serverInfo"' "$mcp_body" >/dev/null; then
            echo "::error::Authenticated MCP initialize failed with HTTP $mcp_code"
            exit 1
          fi

          mcp_session_id=$(awk '
            BEGIN { IGNORECASE=1 }
            /^mcp-session-id:/ {
              gsub(/\r/, "", $2)
              print $2
            }
          ' "$mcp_headers" | tail -n 1)
          if [ -z "$mcp_session_id" ]; then
            echo "::error::Authenticated MCP initialize returned no session ID"
            exit 1
          fi

          tools_body="$RUNNER_TEMP/durabull-mcp-tools.txt"
          tools_payload='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          curl -fsS \
            --max-time 20 \
            -o "$tools_body" \
            "${access_headers[@]}" \
            -H "Origin: $base_url" \
            -H "Authorization: Bearer ${DURABULL_MCP_AUTHLESS_BEARER}" \
            -H "Mcp-Session-Id: $mcp_session_id" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data "$tools_payload" \
            "$base_url/mcp"
          tools_json="$RUNNER_TEMP/durabull-mcp-tools.json"
          sed -n 's/^data: //p' "$tools_body" | tail -n 1 > "$tools_json"
          jq -e '
            (.result.tools | length) == 13 and
            ([.result.tools[].name] | sort) == ([
              "explain_job_failure", "get_failure_events", "get_job",
              "get_job_logs", "get_job_stacktraces", "get_queue",
              "get_queue_metrics", "get_workers", "list_connections",
              "list_jobs", "list_queues", "ping", "resolve_alert_event"
            ] | sort) and
            all(.result.tools[] | select(.name != "resolve_alert_event");
              .annotations == {
                "readOnlyHint": true,
                "destructiveHint": false,
                "idempotentHint": true,
                "openWorldHint": false
              }
            ) and
            (.result.tools[] | select(.name == "resolve_alert_event") | .annotations) == {
              "readOnlyHint": false,
              "destructiveHint": false,
              "idempotentHint": true,
              "openWorldHint": false
            }
          ' "$tools_json" >/dev/null

          list_connections_body="$RUNNER_TEMP/durabull-mcp-list-connections.txt"
          list_connections_payload='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_connections","arguments":{"pageSize":10}}}'
          curl -fsS \
            --max-time 20 \
            -o "$list_connections_body" \
            "${access_headers[@]}" \
            -H "Origin: $base_url" \
            -H "Authorization: Bearer ${DURABULL_MCP_AUTHLESS_BEARER}" \
            -H "Mcp-Session-Id: $mcp_session_id" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data "$list_connections_payload" \
            "$base_url/mcp"
          list_connections_json="$RUNNER_TEMP/durabull-mcp-list-connections.json"
          sed -n 's/^data: //p' "$list_connections_body" | tail -n 1 > "$list_connections_json"
          jq -e '
            .result.isError != true and
            (.result.content[0].text | fromjson | .connections | map(.name) | sort) == ["Production", "Staging"]
          ' "$list_connections_json" >/dev/null
          jq -r '.result.content[0].text' "$list_connections_json" \
            > "$RUNNER_TEMP/durabull-mcp-connections.json"

          for connection_name in Production Staging; do
            connection_id=$(jq -er \
              --arg name "$connection_name" \
              '.connections[] | select(.name == $name) | .id' \
              "$RUNNER_TEMP/durabull-mcp-connections.json")
            queues_ready=false
            for attempt in $(seq 1 12); do
              list_queues_payload=$(jq -cn \
                --arg connection_id "$connection_id" \
                '{jsonrpc:"2.0",id:4,method:"tools/call",params:{name:"list_queues",arguments:{connectionId:$connection_id,pageSize:5}}}')
              list_queues_body="$RUNNER_TEMP/durabull-mcp-list-queues-${connection_name}.txt"
              curl -fsS \
                --max-time 30 \
                -o "$list_queues_body" \
                "${access_headers[@]}" \
                -H "Origin: $base_url" \
                -H "Authorization: Bearer ${DURABULL_MCP_AUTHLESS_BEARER}" \
                -H "Mcp-Session-Id: $mcp_session_id" \
                -H 'Accept: application/json, text/event-stream' \
                -H 'Content-Type: application/json' \
                --data "$list_queues_payload" \
                "$base_url/mcp"
              list_queues_json="$RUNNER_TEMP/durabull-mcp-list-queues-${connection_name}.json"
              sed -n 's/^data: //p' "$list_queues_body" | tail -n 1 > "$list_queues_json"
            if jq -e '
              .result.isError != true and
              ((.result.content[0].text | fromjson) as $payload |
                $payload.total >= 1 and
                ($payload.queues | length) >= 1 and
                all($payload.queues[];
                  (.name | type == "string" and length >= 1) and
                  (.jobCounts | type == "object")
                ))
            ' "$list_queues_json" >/dev/null; then
                queues_ready=true
                break
              fi
              echo "$connection_name MCP queue check attempt ${attempt}/12 not ready"
              sleep 5
            done
            if [ "$queues_ready" != "true" ]; then
              echo "::error::$connection_name queues did not become available through MCP"
              exit 1
            fi
          done

          app_id=$(doctl apps list --output json \
            | jq -er '.[] | select(.spec.name == "minds-durabull-internal") | .id')
          doctl apps get "$app_id" --output json \
            | jq -e --arg build_id "$GITHUB_SHA" '
                .spec.services[] |
                select(.name == "durabull") |
                .image.registry_type == "DOCR" and
                .image.registry == "training" and
                .image.repository == "durabull" and
                .image.tag == $build_id
              ' >/dev/null

          echo "Cloudflare path isolation, immutable image, 13 MCP tool annotations, Production/Staging connections, and live Redis queue reads through MCP: ok"

      - name: Record deployment boundary
        run: |
          {
            echo "### Minds internal Durabull"
            echo
            echo "- DigitalOcean app: \`minds-durabull-internal\`"
            echo "- Public DigitalOcean ingress: none"
            echo "- Origin path: Cloudflare Tunnel → \`http://durabull:3000\`"
            echo "- Cloudflare dashboard isolation, MCP dual-auth boundary, immutable source image, 13 MCP tools/annotations, Production/Staging connections, and live Redis queue reads through MCP: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove rendered secret material
        if: always()
        run: rm -f deploy/digitalocean-app.rendered.json
