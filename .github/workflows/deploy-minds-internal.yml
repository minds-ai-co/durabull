name: Deploy Minds internal Durabull

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-minds-internal.yml
      - deploy/digitalocean-app.template.json
      - deploy/render-digitalocean-spec.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-minds-internal-durabull
  cancel-in-progress: false

env:
  PRODUCTION_VALKEY_CLUSTER_ID: 1a8db10a-cad7-4eb3-8073-c046e98e5a7f

jobs:
  deploy:
    name: Deploy standalone internal app
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DURABULL_MCP_AUTHLESS_BEARER: ${{ secrets.DURABULL_MCP_AUTHLESS_BEARER }}
          DURABULL_REDIS_URL_ENCRYPTION_KEY: ${{ secrets.DURABULL_REDIS_URL_ENCRYPTION_KEY }}
          DURABULL_SECRET_ENCRYPTION_KEY: ${{ secrets.DURABULL_SECRET_ENCRYPTION_KEY }}
          DURABULL_PRODUCTION_REDIS_URL: ${{ secrets.DURABULL_PRODUCTION_REDIS_URL }}
          DURABULL_STAGING_REDIS_URL: ${{ secrets.DURABULL_STAGING_REDIS_URL }}
        run: |
          set -euo pipefail
          required=(
            DIGITALOCEAN_ACCESS_TOKEN
            CLOUDFLARE_TUNNEL_TOKEN
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
            DURABULL_MCP_AUTHLESS_BEARER
            DURABULL_REDIS_URL_ENCRYPTION_KEY
            DURABULL_SECRET_ENCRYPTION_KEY
            DURABULL_PRODUCTION_REDIS_URL
            DURABULL_STAGING_REDIS_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production secrets: ${missing[*]}"
            exit 1
          fi

      - name: Render app spec
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DURABULL_MCP_AUTHLESS_BEARER: ${{ secrets.DURABULL_MCP_AUTHLESS_BEARER }}
          DURABULL_REDIS_URL_ENCRYPTION_KEY: ${{ secrets.DURABULL_REDIS_URL_ENCRYPTION_KEY }}
          DURABULL_SECRET_ENCRYPTION_KEY: ${{ secrets.DURABULL_SECRET_ENCRYPTION_KEY }}
          DURABULL_PRODUCTION_REDIS_URL: ${{ secrets.DURABULL_PRODUCTION_REDIS_URL }}
          DURABULL_STAGING_REDIS_URL: ${{ secrets.DURABULL_STAGING_REDIS_URL }}
        run: |
          chmod +x deploy/render-digitalocean-spec.sh
          deploy/render-digitalocean-spec.sh \
            deploy/digitalocean-app.template.json \
            deploy/digitalocean-app.rendered.json

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Validate app spec
        run: doctl apps spec validate deploy/digitalocean-app.rendered.json

      - name: Create or update standalone app
        run: |
          set -euo pipefail
          doctl apps create \
            --upsert \
            --update-sources \
            --wait \
            --spec deploy/digitalocean-app.rendered.json \
            --format ID,Spec.Name,ActiveDeployment.ID

      - name: Reconcile production Valkey trusted source
        run: |
          set -euo pipefail

          app_id=$(doctl apps list --output json \
            | jq -er '.[] | select(.spec.name == "minds-durabull-internal") | .id')
          is_trusted=$(doctl databases firewalls list \
            "$PRODUCTION_VALKEY_CLUSTER_ID" \
            --output json \
            | jq -r --arg app_id "$app_id" \
              'any(.[]; .type == "app" and .value == $app_id)')

          if [ "$is_trusted" != "true" ]; then
            doctl databases firewalls append \
              "$PRODUCTION_VALKEY_CLUSTER_ID" \
              --rule "app:$app_id"
          fi

          doctl databases firewalls list \
            "$PRODUCTION_VALKEY_CLUSTER_ID" \
            --output json \
            | jq -e --arg app_id "$app_id" \
              'any(.[]; .type == "app" and .value == $app_id)' >/dev/null

      - name: Verify protected live deployment
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DURABULL_MCP_AUTHLESS_BEARER: ${{ secrets.DURABULL_MCP_AUTHLESS_BEARER }}
        run: |
          set -euo pipefail

          base_url=https://durabull.getminds.ai
          access_headers=(
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          )
          health_body="$RUNNER_TEMP/durabull-health.json"

          access_boundary_code=$(curl -sS \
            --max-time 20 \
            -o /dev/null \
            -w '%{http_code}' \
            "$base_url/api/health")
          if [ "$access_boundary_code" != "302" ]; then
            echo "::error::Unauthenticated health returned HTTP $access_boundary_code; expected Cloudflare Access redirect"
            exit 1
          fi

          healthy=false
          for attempt in $(seq 1 12); do
            health_code=$(curl -sS \
              --max-time 20 \
              -o "$health_body" \
              -w '%{http_code}' \
              "${access_headers[@]}" \
              "$base_url/api/health" || true)
            if [ "$health_code" = "200" ] && jq -e '.status == "ok"' "$health_body" >/dev/null; then
              healthy=true
              break
            fi
            echo "protected health attempt ${attempt}/12 returned HTTP ${health_code:-000}"
            sleep 5
          done
          if [ "$healthy" != "true" ]; then
            echo "::error::Protected Durabull health check did not become ready"
            exit 1
          fi

          curl -fsS \
            --max-time 20 \
            "${access_headers[@]}" \
            "$base_url/api/app/config" \
            | jq -e '
                .authless == true and
                .envConnections == true and
                .persistence == "pglite" and
                .stateless == true and
                .environment == "production"
              ' >/dev/null

          curl -fsS \
            --max-time 20 \
            "${access_headers[@]}" \
            "$base_url/api/auth/get-session" \
            | jq -e '
                .user.id == "authless-user" and
                .session.activeOrganizationId == "authless-org"
              ' >/dev/null

          connections_body="$RUNNER_TEMP/durabull-connections.json"
          curl -fsS \
            --max-time 20 \
            "${access_headers[@]}" \
            "$base_url/api/connections" \
            > "$connections_body"
          jq -e '
                ([.connections[].name] | sort) == ["Production", "Staging"] and
                ([.connections[] | select(.name == "Production" and .isDefault == true)] | length) == 1
              ' "$connections_body" >/dev/null

          for connection_name in Production Staging; do
            connection_id=$(jq -er \
              --arg name "$connection_name" \
              '.connections[] | select(.name == $name) | .id' \
              "$connections_body")
            discovery_body="$RUNNER_TEMP/durabull-discovery-${connection_name}.json"
            discovery_code=$(curl -sS \
              --max-time 60 \
              -o "$discovery_body" \
              -w '%{http_code}' \
              -X POST \
              "${access_headers[@]}" \
              "$base_url/api/c/$connection_id/queues/discovery?wait=true")
            if [ "$discovery_code" != "200" ]; then
              echo "::error::$connection_name Redis discovery returned HTTP $discovery_code"
              jq -c '{error, message}' "$discovery_body" || true
              exit 1
            fi
            jq -e '
                .running == false and
                .lastError == null and
                .scannedPages >= 1 and
                .indexed.total >= 1 and
                .indexed.confirmed >= 1
              ' "$discovery_body" >/dev/null

            queues_body="$RUNNER_TEMP/durabull-queues-${connection_name}.json"
            curl -fsS \
              --max-time 30 \
              "${access_headers[@]}" \
              "$base_url/api/c/$connection_id/queues?page=1&pageSize=5" \
              > "$queues_body"
            jq -e '
                .total >= 1 and
                (.queues | length) >= 1 and
                all(.queues[];
                  (.name | type == "string" and length >= 1) and
                  (.jobCounts | type == "object")
                )
              ' "$queues_body" >/dev/null
          done

          curl -fsS \
            --max-time 20 \
            "${access_headers[@]}" \
            "$base_url/" \
            | grep -F '<title>Durabull - BullMQ Admin Dashboard</title>' >/dev/null

          initialize_payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"minds-deploy-e2e","version":"1.0.0"}}}'
          mcp_without_bearer=$(curl -sS \
            --max-time 20 \
            -o /dev/null \
            -w '%{http_code}' \
            "${access_headers[@]}" \
            -H "Origin: $base_url" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data "$initialize_payload" \
            "$base_url/mcp")
          if [ "$mcp_without_bearer" != "401" ]; then
            echo "::error::MCP without its bearer returned HTTP $mcp_without_bearer; expected 401"
            exit 1
          fi

          mcp_body="$RUNNER_TEMP/durabull-mcp-initialize.txt"
          mcp_code=$(curl -sS \
            --max-time 20 \
            -o "$mcp_body" \
            -w '%{http_code}' \
            "${access_headers[@]}" \
            -H "Origin: $base_url" \
            -H "Authorization: Bearer ${DURABULL_MCP_AUTHLESS_BEARER}" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data "$initialize_payload" \
            "$base_url/mcp")
          if [ "$mcp_code" != "200" ] || ! grep -F '"serverInfo"' "$mcp_body" >/dev/null; then
            echo "::error::Authenticated MCP initialize failed with HTTP $mcp_code"
            exit 1
          fi

          echo "Protected health, authless UI state, Redis discovery, queue metrics, and MCP initialize: ok"

      - name: Record deployment boundary
        run: |
          {
            echo "### Minds internal Durabull"
            echo
            echo "- DigitalOcean app: \`minds-durabull-internal\`"
            echo "- Public DigitalOcean ingress: none"
            echo "- Origin path: Cloudflare Tunnel → \`http://durabull:3000\`"
            echo "- Protected health, authless state, Production/Staging Redis discovery, queue metrics, and MCP initialize: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove rendered secret material
        if: always()
        run: rm -f deploy/digitalocean-app.rendered.json
