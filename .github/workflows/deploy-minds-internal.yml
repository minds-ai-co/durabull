name: Deploy Minds internal Durabull

on:
  push:
    branches:
      - main
    paths:
      - deploy/digitalocean-app.template.json
      - deploy/render-digitalocean-spec.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-minds-internal-durabull
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy standalone internal app
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DURABULL_MCP_AUTHLESS_BEARER: ${{ secrets.DURABULL_MCP_AUTHLESS_BEARER }}
          DURABULL_REDIS_URL_ENCRYPTION_KEY: ${{ secrets.DURABULL_REDIS_URL_ENCRYPTION_KEY }}
          DURABULL_SECRET_ENCRYPTION_KEY: ${{ secrets.DURABULL_SECRET_ENCRYPTION_KEY }}
          DURABULL_PRODUCTION_REDIS_URL: ${{ secrets.DURABULL_PRODUCTION_REDIS_URL }}
          DURABULL_STAGING_REDIS_URL: ${{ secrets.DURABULL_STAGING_REDIS_URL }}
        run: |
          set -euo pipefail
          required=(
            DIGITALOCEAN_ACCESS_TOKEN
            CLOUDFLARE_TUNNEL_TOKEN
            DURABULL_MCP_AUTHLESS_BEARER
            DURABULL_REDIS_URL_ENCRYPTION_KEY
            DURABULL_SECRET_ENCRYPTION_KEY
            DURABULL_PRODUCTION_REDIS_URL
            DURABULL_STAGING_REDIS_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production secrets: ${missing[*]}"
            exit 1
          fi

      - name: Render app spec
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DURABULL_MCP_AUTHLESS_BEARER: ${{ secrets.DURABULL_MCP_AUTHLESS_BEARER }}
          DURABULL_REDIS_URL_ENCRYPTION_KEY: ${{ secrets.DURABULL_REDIS_URL_ENCRYPTION_KEY }}
          DURABULL_SECRET_ENCRYPTION_KEY: ${{ secrets.DURABULL_SECRET_ENCRYPTION_KEY }}
          DURABULL_PRODUCTION_REDIS_URL: ${{ secrets.DURABULL_PRODUCTION_REDIS_URL }}
          DURABULL_STAGING_REDIS_URL: ${{ secrets.DURABULL_STAGING_REDIS_URL }}
        run: |
          chmod +x deploy/render-digitalocean-spec.sh
          deploy/render-digitalocean-spec.sh \
            deploy/digitalocean-app.template.json \
            deploy/digitalocean-app.rendered.json

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Validate app spec
        run: doctl apps spec validate deploy/digitalocean-app.rendered.json

      - name: Create or update standalone app
        run: |
          set -euo pipefail
          doctl apps create \
            --upsert \
            --update-sources \
            --wait \
            --spec deploy/digitalocean-app.rendered.json \
            --format ID,Spec.Name,ActiveDeployment.ID

      - name: Record deployment boundary
        run: |
          {
            echo "### Minds internal Durabull"
            echo
            echo "- DigitalOcean app: \`minds-durabull-internal\`"
            echo "- Public DigitalOcean ingress: none"
            echo "- Origin path: Cloudflare Tunnel → \`http://durabull:3000\`"
            echo "- DNS cutover remains a separate owner-controlled Cloudflare action."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove rendered secret material
        if: always()
        run: rm -f deploy/digitalocean-app.rendered.json
