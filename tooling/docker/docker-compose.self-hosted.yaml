# Durabull self-hosted Compose — API, web, and MCP on one port (default 3000).
# MCP endpoint: {APP_BASE_URL}/mcp (no separate MCP_PORT).
# Defaults to OAuth mode (DURABULL_AUTHLESS=false): set BETTER_AUTH_SECRET.
# Authless lab: set DURABULL_AUTHLESS=true + MCP_AUTHLESS_BEARER_TOKEN; BETTER_AUTH_SECRET is still required here — use a long random value.
# Redis is not published to the host (internal network only).

name: durabull-self-hosted

services:
  durabull:
    # Pin a version tag in production (avoid mutable :latest).
    image: "${DURABULL_IMAGE:-ghcr.io/durabullhq/durabull:latest}"
    restart: unless-stopped
    ports:
      - "${DURABULL_APP_PORT:-3000}:3000"
    environment:
      DURABULL_AUTHLESS: "${DURABULL_AUTHLESS:-false}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set a long random secret (required for this Compose file)}"
      MCP_AUTHLESS_BEARER_TOKEN: "${MCP_AUTHLESS_BEARER_TOKEN:-}"
      DURABULL_ENV_CONNECTIONS: "${DURABULL_ENV_CONNECTIONS:-true}"
      DURABULL_REDIS_URL_ENCRYPTION_KEY: "${DURABULL_REDIS_URL_ENCRYPTION_KEY:?set a 32-byte key with 'openssl rand -hex 32'}"
      DURABULL_REDIS_URL_MAIN: "${DURABULL_REDIS_URL_MAIN:-redis://redis:6379}"
      DURABULL_REDIS_URL_MAIN_ENVIRONMENT: "${DURABULL_REDIS_URL_MAIN_ENVIRONMENT:-development}"
      DURABULL_REDIS_URL_DEFAULT: "${DURABULL_REDIS_URL_DEFAULT:-MAIN}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:3000}"
      VITE_PUBLIC_APP_URL: "${VITE_PUBLIC_APP_URL:-http://localhost:3000}"
    volumes:
      - durabull_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Internal network only — do not publish Redis to the host in production.
    # For production, add Redis AUTH/ACL at the infrastructure layer; this file does not set requirepass.
    # For local Redis CLI debugging, temporarily add: ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes

volumes:
  durabull_data:
    driver: local
  redis_data:
    driver: local
